[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-enhancement-platform"
version = "0.1.0"
description = "AI-powered image enhancement and super-resolution platform"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
include = ["ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
